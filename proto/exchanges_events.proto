syntax = "proto3";

package exchanges_events;

option go_package = "github.com/veska-io/streams-proto;eeventspb";

message ExchangesEvent{
	message PriceEvent {
		optional double price_open = 1;
		optional double price_close = 2;
		optional double price_high = 3;
		optional double price_low = 4;
	}

	message VolumeEvent {
		optional double volume_base = 1;
		optional double volume_quot = 2;
		optional double volume_base_buy_taker = 3;
		optional double volume_quot_buy_taker = 4;
		optional double volume_base_sell_taker = 5;
		optional double volume_quot_sell_taker = 6;
	}

	message OiEvent {
		optional double oi_open = 1;
	}

	message TradesEvent {
		optional uint64 count = 1;
	}

	message LiquidationsEvent {
		optional uint64 liquidations_shorts_count = 1;
		optional uint64 liquidations_longs_count = 2;
		optional double liquidations_shorts_base_volume = 3;
		optional double liquidations_longs_base_volume = 4;
		optional double liquidations_shorts_quot_volume = 5;
		optional double liquidations_longs_quot_volume = 6;
	}

	message FundingRateEvent {
		optional double funding_rate = 1;
		optional double funding_price = 2;
	}

	uint64 event_timestamp = 1;

	string exchange = 2;
	string market = 3;
	string base = 4;
	string quot = 5;

	oneof event {
		PriceEvent price = 6;
		VolumeEvent volume = 7;
		OiEvent oi = 8;
		TradesEvent trades = 9;
		LiquidationsEvent liquidations = 10;
		FundingRateEvent funding_rate = 11;
	}

	uint64 processed_timestamp = 1000;
}
